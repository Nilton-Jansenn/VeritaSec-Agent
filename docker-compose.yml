services:
  postgres:
    image: postgres:16-alpine
    container_name: veritassec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veritassec_agent}
      POSTGRES_USER: ${POSTGRES_USER:-veritassec_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD deve ser definida}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - veritassec_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  veritassec_postgres_data:
